<!DOCTYPE html><html lang='ko'><head><meta charset='UTF-8'><title>점심 메뉴 추천</title></head><body><input id='prompt'><button onclick='recommend()'>추천</button><pre id='result'></pre><script>async function recommend(){const t=prompt.value.trim();if(t!=='추천'){alert('추천 입력');return;}const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:t})});const d=await r.json();result.innerText=d.result;}</script></body></html>
